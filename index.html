<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Perkalian Aurel - Suara Sama</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f8ff;
            --text-color: #333;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#dbeafe 2px, transparent 2px);
            background-size: 30px 30px;
            margin: 0;
            padding: 40px 20px;
            color: var(--text-color);
        }

        h1 {
            text-align: center;
            font-size: 3rem;
            color: #2c3e50;
            margin-bottom: 40px;
            text-shadow: 2px 2px 0px #ffffff;
        }

        h1 span {
            color: #ff6b6b;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            transition: transform 0.3s ease;
            border: 2px solid transparent;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.12);
        }

        .card-header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-size: 1.8rem;
            font-weight: 700;
        }

        .play-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            cursor: pointer;
            font-size: 1.2rem;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            outline: none;
        }

        .play-btn:hover {
            background: white;
            color: inherit;
            transform: scale(1.1);
        }

        .play-btn.playing {
            background: white !important;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        ul {
            list-style: none;
            padding: 20px;
            margin: 0;
            flex-grow: 1;
        }

        li {
            font-size: 1.5rem;
            padding: 12px 15px;
            margin-bottom: 8px;
            background-color: #f8f9fa;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
            border-left: 5px solid transparent;
        }

        li:hover {
            background-color: #eef2ff;
            transform: translateX(5px);
        }

        .result {
            color: #ff6b6b;
            font-weight: 700;
        }

        /* Style Highlight saat membaca */
        li.active-reading {
            background-color: #ffd700;
            color: #333;
            font-weight: bold;
            transform: scale(1.05) translateX(8px);
            border-left: 8px solid #ff4757;
            box-shadow: 0 8px 15px rgba(255, 215, 0, 0.4);
        }

        li.active-reading .result {
            color: #d63031;
        }

        /* Indikator Suara yang dipakai */
        #voice-status {
            text-align: center;
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 20px;
            background: #fff;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            .container { grid-template-columns: 1fr; }
            .card-header { font-size: 1.5rem; }
            li { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <h1>Belajar <span>Perkalian</span> ( Aurel ) 🎈</h1>
    
    <!-- Teks kecil untuk memastikan user tahu suara mana yang aktif -->
    <div style="text-align:center;">
        <div id="voice-status">Memuat Suara...</div>
    </div>
    <br>

    <div class="container" id="perkalianContainer"></div>

    <script>
        const container = document.getElementById("perkalianContainer");
        const voiceStatus = document.getElementById("voice-status");
        const namaAnak = "AUREL";
        
        let indonesianVoice = null;

        // --- LOGIKA PEMILIH SUARA (AGAR SAMA DI PC & HP) ---
        function loadVoices() {
            const voices = window.speechSynthesis.getVoices();
            
            // 1. PRIORITAS UTAMA: Cari "Google Bahasa Indonesia"
            // Suara ini ada di HP Android dan juga di Chrome PC.
            // Ini adalah kunci agar suaranya terdengar sama.
            indonesianVoice = voices.find(voice => voice.name.includes("Google Bahasa Indonesia"));

            // 2. PRIORITAS KEDUA: Jika tidak ada Google, cari "Microsoft Andika" (Standard Windows)
            if (!indonesianVoice) {
                indonesianVoice = voices.find(voice => voice.name.includes("Andika"));
            }

            // 3. FALLBACK: Jika tidak ada keduanya, ambil suara Indonesia apa saja yang tersedia
            if (!indonesianVoice) {
                indonesianVoice = voices.find(voice => voice.lang.includes('id-ID') || voice.lang.includes('ind'));
            }

            // Update status di layar
            if (indonesianVoice) {
                voiceStatus.textContent = "Suara Aktif: " + indonesianVoice.name;
                voiceStatus.style.color = "green";
                voiceStatus.style.fontWeight = "bold";
            } else {
                voiceStatus.textContent = "Suara Bahasa Indonesia tidak ditemukan di perangkat ini.";
                voiceStatus.style.color = "red";
            }
        }

        // Browser Chrome memuat suara secara asinkron (terlambat), jadi kita butuh event listener ini
        window.speechSynthesis.onvoiceschanged = loadVoices;
        // Panggil sekali saja untuk browser lain (Safari/Firefox)
        loadVoices();

        // --- LOGIKA UTAMA APLIKASI ---
        const colors = [
            "#FF6B6B", "#FF4757", "#2ED573", "#1E90FF", "#FFA502", 
            "#3742FA", "#8E44AD", "#FF6B81", "#00CEC9", "#6C5CE7"
        ];

        function playGroup(number, btnElement, listElement) {
            // Pastikan suara sudah dimuat
            if (!indonesianVoice) {
                alert("Mohon tunggu sebentar, sedang memuat suara...");
                loadVoices();
                return;
            }

            window.speechSynthesis.cancel();
            clearHighlights(listElement);

            btnElement.innerHTML = '⏸';
            btnElement.classList.add('playing');

            let queue = [];

            // INTRO
            queue.push({
                text: `${namaAnak}, mari kita belajar perkalian.`,
                type: 'intro'
            });

            // ISI
            for (let j = 1; j <= 10; j++) {
                queue.push({
                    text: `${number} kali ${j} sama dengan ${number * j}`,
                    type: 'math',
                    index: j - 1
                });
            }

            // OUTRO
            queue.push({
                text: `Terimakasih ${namaAnak} sudah belajar Perkalian, semoga jadi anak pintar.`,
                type: 'outro'
            });

            let currentIndex = 0;

            function speakNext() {
                if (currentIndex >= queue.length) {
                    btnElement.innerHTML = '🔊';
                    btnElement.classList.remove('playing');
                    return;
                }

                const currentItem = queue[currentIndex];
                const utterance = new SpeechSynthesisUtterance(currentItem.text);
                
                // --- PAKSAKAN PENGGUNAAN SUARA YANG SUDAH DIPILIH ---
                utterance.voice = indonesianVoice;
                
                // Pengaturan suara agar seragam
                utterance.lang = 'id-ID';
                utterance.rate = 1.0;   // Kecepatan normal (1.0 paling standar antar mesin)
                utterance.pitch = 1.0;  // Nada normal

                // Highlight Logic
                utterance.onstart = function() {
                    if (currentItem.type === 'math') {
                        const liItems = listElement.getElementsByTagName('li');
                        if(liItems[currentItem.index]) {
                            liItems[currentItem.index].classList.add('active-reading');
                            liItems[currentItem.index].scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }
                };

                utterance.onend = function() {
                    if (currentItem.type === 'math') {
                        const liItems = listElement.getElementsByTagName('li');
                        if(liItems[currentItem.index]) {
                            liItems[currentItem.index].classList.remove('active-reading');
                        }
                    }
                    currentIndex++;
                    speakNext();
                };

                utterance.onerror = function() {
                    btnElement.innerHTML = '🔊';
                    btnElement.classList.remove('playing');
                    clearHighlights(listElement);
                };

                window.speechSynthesis.speak(utterance);
            }

            speakNext();
        }

        function clearHighlights(ulElement) {
            const items = ulElement.getElementsByTagName('li');
            for (let item of items) {
                item.classList.remove('active-reading');
            }
        }

        // Generate UI
        for (let i = 1; i <= 10; i++) {
            const cardDiv = document.createElement("div");
            cardDiv.className = "card";

            const header = document.createElement("div");
            header.className = "card-header";
            header.style.backgroundColor = colors[i - 1];

            const title = document.createElement("span");
            title.textContent = "Perkalian " + i;
            
            const btn = document.createElement("button");
            btn.className = "play-btn";
            btn.innerHTML = "🔊";
            
            let listRef = null;
            btn.onclick = function() {
                playGroup(i, btn, listRef);
            };

            header.appendChild(title);
            header.appendChild(btn);
            cardDiv.appendChild(header);

            const list = document.createElement("ul");
            listRef = list;

            for (let j = 1; j <= 10; j++) {
                const listItem = document.createElement("li");
                listItem.innerHTML = `
                    <span>${i} × ${j} = </span>
                    <span class="result">${i * j}</span>
                `;
                list.appendChild(listItem);
            }

            cardDiv.appendChild(list);
            container.appendChild(cardDiv);
        }
    </script>

</body>
</html>
