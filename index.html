<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Perkalian Aurel</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f8ff;
            --text-color: #333;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#dbeafe 2px, transparent 2px);
            background-size: 30px 30px;
            margin: 0;
            padding: 40px 20px;
            color: var(--text-color);
        }

        h1 {
            text-align: center;
            font-size: 3rem;
            color: #2c3e50;
            margin-bottom: 40px;
            text-shadow: 2px 2px 0px #ffffff;
        }

        h1 span {
            color: #ff6b6b;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            transition: transform 0.3s ease;
            border: 2px solid transparent;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.12);
        }

        .card-header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-size: 1.8rem;
            font-weight: 700;
        }

        .play-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            cursor: pointer;
            font-size: 1.2rem;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            outline: none;
            user-select: none;
        }

        .play-btn:hover {
            background: white;
            color: inherit;
            transform: scale(1.1);
        }

        .play-btn.playing {
            background: white !important;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(255, 255, 255, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }

        ul {
            list-style: none;
            padding: 20px;
            margin: 0;
            flex-grow: 1;
        }

        li {
            font-size: 1.5rem;
            padding: 12px 15px;
            margin-bottom: 8px;
            background-color: #f8f9fa;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
            border-left: 5px solid transparent;
        }

        li:hover {
            background-color: #eef2ff;
            transform: translateX(5px);
        }

        .result {
            color: #ff6b6b;
            font-weight: 700;
        }

        li.active-reading {
            background-color: #ffd700;
            color: #333;
            font-weight: bold;
            transform: scale(1.05) translateX(8px);
            border-left: 8px solid #ff4757;
            box-shadow: 0 8px 15px rgba(255, 215, 0, 0.4);
        }

        li.active-reading .result {
            color: #d63031;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            .container { grid-template-columns: 1fr; }
            .card-header { font-size: 1.5rem; }
            li { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <h1>Belajar <span>Perkalian</span> Aurel 🎈</h1>

    <div class="container" id="perkalianContainer"></div>

    <script>
        const container = document.getElementById("perkalianContainer");
        const namaAnak = "AUREL";

        // --- LOGIKA PEMILIHAN SUARA (VOICE FIX) ---
        let selectedVoice = null;

        function loadVoices() {
            const voices = window.speechSynthesis.getVoices();
            
            // 1. Cari semua suara Bahasa Indonesia
            const idVoices = voices.filter(v => v.lang.includes('id-ID') || v.lang.includes('ind'));

            if (idVoices.length === 0) return; // Tidak ada suara ID

            // 2. Prioritaskan "Google Bahasa Indonesia" (Agar suara PC & HP Sama)
            const googleVoice = idVoices.find(v => v.name.includes('Google') && v.lang.includes('id-ID'));
            
            // 3. Fallback ke "Microsoft" (Jika di PC tapi tidak ada Google)
            const msVoice = idVoices.find(v => v.name.includes('Microsoft'));

            if (googleVoice) {
                selectedVoice = googleVoice;
            } else if (msVoice) {
                selectedVoice = msVoice;
            } else {
                selectedVoice = idVoices[0]; // Ambil suara ID pertama yang ditemukan
            }
            
            console.log("Suara yang dipilih:", selectedVoice ? selectedVoice.name : "Default");
        }

        // Event listener: Suara di browser Chrome dimuat secara asinkron
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices(); // Coba langsung load (untuk Firefox/Safari)

        // --- LOGIKA KONTROL UTAMA ---
        let activeBtn = null;
        let isPaused = false;

        const colors = [
            "#FF6B6B", "#FF4757", "#2ED573", "#1E90FF", "#FFA502", 
            "#3742FA", "#8E44AD", "#FF6B81", "#00CEC9", "#6C5CE7"
        ];

        function handlePlayPause(number, btnElement, listElement) {
            // Jika tombol yang sama diklik
            if (activeBtn === btnElement) {
                if (isPaused) {
                    window.speechSynthesis.resume();
                    btnElement.innerHTML = '⏸';
                    isPaused = false;
                } else {
                    window.speechSynthesis.pause();
                    btnElement.innerHTML = '▶️';
                    isPaused = true;
                }
                return;
            }

            // Jika tombol baru diklik
            window.speechSynthesis.cancel();
            clearAllHighlights();

            if (activeBtn) {
                activeBtn.innerHTML = '🔊';
                activeBtn.classList.remove('playing');
            }

            activeBtn = btnElement;
            isPaused = false;
            btnElement.innerHTML = '⏸';
            btnElement.classList.add('playing');

            startSequence(number, listElement);
        }

        function startSequence(number, listElement) {
            let queue = [];

            // Intro
            queue.push({ text: `${namaAnak}, mari kita belajar perkalian.`, type: 'intro' });

            // Isi
            for (let j = 1; j <= 10; j++) {
                queue.push({
                    text: `${number} kali ${j} sama dengan ${number * j}`,
                    type: 'math',
                    index: j - 1
                });
            }

            // Outro
            queue.push({
                text: `Terimakasih ${namaAnak} sudah belajar Perkalian, semoga jadi anak pintar.`,
                type: 'outro'
            });

            let currentIndex = 0;

            function speakNext() {
                // Jika dijeda, jangan lanjut
                if (window.speechSynthesis.paused) {
                    return; 
                }

                // Cek selesai
                if (currentIndex >= queue.length) {
                    resetUI();
                    return;
                }

                const currentItem = queue[currentIndex];
                const utterance = new SpeechSynthesisUtterance(currentItem.text);
                
                // --- PENERAPAN SUARA YANG SUDAH DIPILIH ---
                utterance.voice = selectedVoice; 
                utterance.lang = 'id-ID';
                utterance.rate = 1.0;   // Kecepatan standar (agar sama di semua device)
                utterance.pitch = 1.1;  // Nada sedikit ceria

                // Event Start
                utterance.onstart = function() {
                    if (currentItem.type === 'math') {
                        const liItems = listElement.getElementsByTagName('li');
                        if(liItems[currentItem.index]) {
                            liItems[currentItem.index].classList.add('active-reading');
                            liItems[currentItem.index].scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }
                };

                // Event End
                utterance.onend = function() {
                    if (currentItem.type === 'math') {
                        const liItems = listElement.getElementsByTagName('li');
                        if(liItems[currentItem.index]) {
                            liItems[currentItem.index].classList.remove('active-reading');
                        }
                    }

                    if (!isPaused) {
                        currentIndex++;
                        speakNext();
                    }
                };

                utterance.onerror = function() {
                    resetUI();
                };

                window.speechSynthesis.speak(utterance);
            }

            speakNext();
        }

        function resetUI() {
            if (activeBtn) {
                activeBtn.innerHTML = '🔊';
                activeBtn.classList.remove('playing');
                activeBtn = null;
            }
            isPaused = false;
            clearAllHighlights();
        }

        function clearAllHighlights() {
            document.querySelectorAll('.active-reading').forEach(el => el.classList.remove('active-reading'));
        }

        // Render Kartu
        for (let i = 1; i <= 10; i++) {
            const cardDiv = document.createElement("div");
            cardDiv.className = "card";

            const header = document.createElement("div");
            header.className = "card-header";
            header.style.backgroundColor = colors[i - 1];

            const title = document.createElement("span");
            title.textContent = "Perkalian " + i;
            
            const btn = document.createElement("button");
            btn.className = "play-btn";
            btn.innerHTML = "🔊";
            btn.setAttribute("aria-label", "Kontrol suara perkalian " + i);
            
            let listRef = null;

            btn.onclick = function() {
                handlePlayPause(i, btn, listRef);
            };

            header.appendChild(title);
            header.appendChild(btn);
            cardDiv.appendChild(header);

            const list = document.createElement("ul");
            listRef = list;

            for (let j = 1; j <= 10; j++) {
                const listItem = document.createElement("li");
                listItem.innerHTML = `
                    <span>${i} × ${j} = </span>
                    <span class="result">${i * j}</span>
                `;
                list.appendChild(listItem);
            }

            cardDiv.appendChild(list);
            container.appendChild(cardDiv);
        }
    </script>

</body>
</html>
