<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Perkalian Aurel</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f8ff;
            --text-color: #333;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#dbeafe 2px, transparent 2px);
            background-size: 30px 30px;
            margin: 0;
            padding: 40px 20px;
            color: var(--text-color);
        }

        h1 {
            text-align: center;
            font-size: 3rem;
            color: #2c3e50;
            margin-bottom: 40px;
            text-shadow: 2px 2px 0px #ffffff;
        }

        h1 span {
            color: #ff6b6b;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            transition: transform 0.3s ease;
            border: 2px solid transparent;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.12);
        }

        .card-header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-size: 1.8rem;
            font-weight: 700;
        }

        /* Styling Tombol Control */
        .play-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            cursor: pointer;
            font-size: 1.2rem;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            outline: none;
            user-select: none;
        }

        .play-btn:hover {
            background: white;
            color: inherit;
            transform: scale(1.1);
        }

        /* Animasi berdenyut saat sedang memutar */
        .play-btn.playing {
            background: white !important;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(255, 255, 255, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }

        ul {
            list-style: none;
            padding: 20px;
            margin: 0;
            flex-grow: 1;
        }

        li {
            font-size: 1.5rem;
            padding: 12px 15px;
            margin-bottom: 8px;
            background-color: #f8f9fa;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
            border-left: 5px solid transparent;
        }

        li:hover {
            background-color: #eef2ff;
            transform: translateX(5px);
        }

        .result {
            color: #ff6b6b;
            font-weight: 700;
        }

        /* --- STYLE SAAT SEDANG DIBACA (ACTIVE READING) --- */
        li.active-reading {
            background-color: #ffd700; /* Kuning Emas */
            color: #333;
            font-weight: bold;
            transform: scale(1.05) translateX(8px);
            border-left: 8px solid #ff4757;
            box-shadow: 0 8px 15px rgba(255, 215, 0, 0.4);
        }

        li.active-reading .result {
            color: #d63031;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            .container { grid-template-columns: 1fr; }
            .card-header { font-size: 1.5rem; }
            li { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <h1>Belajar <span>Perkalian</span> Aurel 🎈</h1>

    <div class="container" id="perkalianContainer"></div>

    <script>
        const container = document.getElementById("perkalianContainer");
        const namaAnak = "AUREL";

        // Variabel Global untuk Melacak Status Suara
        let activeBtn = null; // Tombol mana yang sedang aktif
        let isPaused = false; // Apakah suara sedang dijeda?

        const colors = [
            "#FF6B6B", "#FF4757", "#2ED573", "#1E90FF", "#FFA502", 
            "#3742FA", "#8E44AD", "#FF6B81", "#00CEC9", "#6C5CE7"
        ];

        function handlePlayPause(number, btnElement, listElement) {
            // KASUS 1: Jika tombol yang diklik adalah tombol yang SEDANG AKTIF
            if (activeBtn === btnElement) {
                if (isPaused) {
                    // AKSI: RESUME (Lanjutkan)
                    window.speechSynthesis.resume();
                    btnElement.innerHTML = '⏸';
                    isPaused = false;
                } else {
                    // AKSI: PAUSE (Jeda)
                    window.speechSynthesis.pause();
                    btnElement.innerHTML = '▶️'; // Ubah ikon jadi Play
                    isPaused = true;
                }
                return;
            }

            // KASUS 2: Jika tombol yang diklik adalah tombol BARU (bukan yang sedang aktif)
            
            // 1. Reset suara dan highlight global
            window.speechSynthesis.cancel();
            clearAllHighlights();

            // 2. Reset tombol lama (jika ada)
            if (activeBtn) {
                activeBtn.innerHTML = '🔊';
                activeBtn.classList.remove('playing');
            }

            // 3. Set tombol baru sebagai aktif
            activeBtn = btnElement;
            isPaused = false;
            btnElement.innerHTML = '⏸';
            btnElement.classList.add('playing');

            // 4. Mulai Proses Baca Baru
            startSequence(number, listElement);
        }

        function startSequence(number, listElement) {
            // Siapkan antrian
            let queue = [];

            // Intro
            queue.push({ text: `${namaAnak}, mari kita belajar perkalian.`, type: 'intro' });

            // Isi
            for (let j = 1; j <= 10; j++) {
                queue.push({
                    text: `${number} kali ${j} sama dengan ${number * j}`,
                    type: 'math',
                    index: j - 1
                });
            }

            // Outro
            queue.push({
                text: `Terimakasih ${namaAnak} sudah belajar Perkalian, semoga jadi anak pintar.`,
                type: 'outro'
            });

            let currentIndex = 0;

            function speakNext() {
                // Jika user menekan tombol lain di luar fungsi ini, activeBtn akan berubah
                // atau suara dibatalkan (cancel), maka loop ini harus berhenti.
                if (window.speechSynthesis.paused) {
                    // Jika dijeda oleh tombol pause, jangan lanjut ke index berikutnya
                    // Tunggu sampai resume dipanggil.
                    return; 
                }

                // Cek apakah masih ada antrian
                if (currentIndex >= queue.length) {
                    // SELESAI
                    resetUI();
                    return;
                }

                const currentItem = queue[currentIndex];
                const utterance = new SpeechSynthesisUtterance(currentItem.text);
                
                utterance.lang = 'id-ID';
                utterance.rate = 0.9; 
                utterance.pitch = 1.2;

                // Saat mulai bicara
                utterance.onstart = function() {
                    // Highlight baris jika tipe matematika
                    if (currentItem.type === 'math') {
                        const liItems = listElement.getElementsByTagName('li');
                        if(liItems[currentItem.index]) {
                            liItems[currentItem.index].classList.add('active-reading');
                            liItems[currentItem.index].scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }
                };

                // Saat selesai bicara satu kalimat
                utterance.onend = function() {
                    // Hapus highlight
                    if (currentItem.type === 'math') {
                        const liItems = listElement.getElementsByTagName('li');
                        if(liItems[currentItem.index]) {
                            liItems[currentItem.index].classList.remove('active-reading');
                        }
                    }

                    // Lanjut ke kalimat berikutnya HANYA jika tidak dijeda
                    if (!isPaused) {
                        currentIndex++;
                        speakNext();
                    }
                };

                utterance.onerror = function() {
                    resetUI();
                };

                window.speechSynthesis.speak(utterance);
            }

            // Mulai loop
            speakNext();
        }

        function resetUI() {
            if (activeBtn) {
                activeBtn.innerHTML = '🔊';
                activeBtn.classList.remove('playing');
                activeBtn = null;
            }
            isPaused = false;
            clearAllHighlights();
        }

        function clearAllHighlights() {
            document.querySelectorAll('.active-reading').forEach(el => el.classList.remove('active-reading'));
        }

        // Membuat Kartu
        for (let i = 1; i <= 10; i++) {
            const cardDiv = document.createElement("div");
            cardDiv.className = "card";

            const header = document.createElement("div");
            header.className = "card-header";
            header.style.backgroundColor = colors[i - 1];

            const title = document.createElement("span");
            title.textContent = "Perkalian " + i;
            
            const btn = document.createElement("button");
            btn.className = "play-btn";
            btn.innerHTML = "🔊"; // Awal: Speaker
            btn.setAttribute("aria-label", "Kontrol suara perkalian " + i);
            
            let listRef = null;

            // Panggil fungsi handlePlayPause saat diklik
            btn.onclick = function() {
                handlePlayPause(i, btn, listRef);
            };

            header.appendChild(title);
            header.appendChild(btn);
            cardDiv.appendChild(header);

            const list = document.createElement("ul");
            listRef = list;

            for (let j = 1; j <= 10; j++) {
                const listItem = document.createElement("li");
                listItem.innerHTML = `
                    <span>${i} × ${j} = </span>
                    <span class="result">${i * j}</span>
                `;
                list.appendChild(listItem);
            }

            cardDiv.appendChild(list);
            container.appendChild(cardDiv);
        }
    </script>

</body>
</html>
