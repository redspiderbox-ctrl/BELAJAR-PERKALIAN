<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Perkalian Aurel</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f8ff;
            --text-color: #333;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#dbeafe 2px, transparent 2px);
            background-size: 30px 30px;
            margin: 0;
            padding: 40px 20px;
            color: var(--text-color);
        }

        h1 {
            text-align: center;
            font-size: 3rem;
            color: #2c3e50;
            margin-bottom: 40px;
            text-shadow: 2px 2px 0px #ffffff;
        }

        h1 span {
            color: #ff6b6b;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            transition: transform 0.3s ease;
            border: 2px solid transparent;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.12);
        }

        .card-header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-size: 1.8rem;
            font-weight: 700;
        }

        .play-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            cursor: pointer;
            font-size: 1.2rem;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            outline: none;
        }

        .play-btn:hover {
            background: white;
            color: inherit;
            transform: scale(1.1);
        }

        .play-btn.playing {
            background: white !important;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        ul {
            list-style: none;
            padding: 20px;
            margin: 0;
            flex-grow: 1;
        }

        li {
            font-size: 1.5rem;
            padding: 12px 15px;
            margin-bottom: 8px;
            background-color: #f8f9fa;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease; /* Transisi halus */
            border-left: 5px solid transparent; /* Persiapan untuk border highlight */
        }

        li:hover {
            background-color: #eef2ff;
            transform: translateX(5px);
        }

        .result {
            color: #ff6b6b;
            font-weight: 700;
        }

        /* --- STYLE BARU: SAAT SEDANG DIBACA (ACTIVE READING) --- */
        li.active-reading {
            background-color: #ffd700; /* Warna Kuning Emas */
            color: #333;
            font-weight: bold;
            transform: scale(1.05) translateX(8px); /* Agak membesar dan geser kanan */
            border-left: 8px solid #ff4757; /* Garis merah di kiri */
            box-shadow: 0 8px 15px rgba(255, 215, 0, 0.4); /* Bayangan berwarna */
        }

        li.active-reading .result {
            color: #d63031; /* Warna hasil ikut berubah jadi merah gelap */
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            .container { grid-template-columns: 1fr; }
            .card-header { font-size: 1.5rem; }
            li { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <h1>Belajar <span>Perkalian</span> Aurel 🎈</h1>

    <div class="container" id="perkalianContainer"></div>

    <script>
        const container = document.getElementById("perkalianContainer");
        const namaAnak = "AUREL"; // Nama anak

        const colors = [
            "#FF6B6B", "#FF4757", "#2ED573", "#1E90FF", "#FFA502", 
            "#3742FA", "#8E44AD", "#FF6B81", "#00CEC9", "#6C5CE7"
        ];

        function playGroup(number, btnElement, listElement) {
            // 1. Hentikan suara dan bersihkan highlight jika ada
            window.speechSynthesis.cancel();
            clearHighlights(listElement);

            // 2. Ubah tampilan tombol
            btnElement.innerHTML = '⏸';
            btnElement.classList.add('playing');

            // 3. Siapkan antrian kalimat (Queue)
            // Kita buat array object berisi teks dan tipe aksinya
            let queue = [];

            // A. INTRO
            queue.push({
                text: `${namaAnak}, mari kita belajar perkalian.`,
                type: 'intro'
            });

            // B. ISI PERKALIAN
            for (let j = 1; j <= 10; j++) {
                queue.push({
                    text: `${number} kali ${j} sama dengan ${number * j}`,
                    type: 'math',
                    index: j - 1 // index untuk elemen li (0 sampai 9)
                });
            }

            // C. OUTRO
            queue.push({
                text: `Terimakasih ${namaAnak} sudah belajar Perkalian, semoga jadi anak pintar.`,
                type: 'outro'
            });

            let currentIndex = 0;

            function speakNext() {
                // Cek jika sudah selesai antrian
                if (currentIndex >= queue.length) {
                    btnElement.innerHTML = '🔊';
                    btnElement.classList.remove('playing');
                    return;
                }

                const currentItem = queue[currentIndex];
                const utterance = new SpeechSynthesisUtterance(currentItem.text);
                
                // Pengaturan Suara
                utterance.lang = 'id-ID';
                utterance.rate = 0.9; 
                utterance.pitch = 1.2; // Nada sedikit lebih tinggi agar ceria

                // SAAT MULAI BICARA (ON START)
                utterance.onstart = function() {
                    if (currentItem.type === 'math') {
                        // Tambahkan class highlight ke baris yang sedang dibaca
                        const liItems = listElement.getElementsByTagName('li');
                        if(liItems[currentItem.index]) {
                            liItems[currentItem.index].classList.add('active-reading');
                            
                            // Opsional: Auto scroll jika di layar kecil
                            liItems[currentItem.index].scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }
                };

                // SAAT SELESAI BICARA (ON END)
                utterance.onend = function() {
                    // Hapus highlight jika tipe matematika
                    if (currentItem.type === 'math') {
                        const liItems = listElement.getElementsByTagName('li');
                        if(liItems[currentItem.index]) {
                            liItems[currentItem.index].classList.remove('active-reading');
                        }
                    }

                    // Lanjut ke kalimat berikutnya
                    currentIndex++;
                    speakNext();
                };

                utterance.onerror = function() {
                    btnElement.innerHTML = '🔊';
                    btnElement.classList.remove('playing');
                    clearHighlights(listElement);
                };

                window.speechSynthesis.speak(utterance);
            }

            // Mulai membaca
            speakNext();
        }

        // Fungsi helper untuk memastikan tidak ada sisa highlight
        function clearHighlights(ulElement) {
            const items = ulElement.getElementsByTagName('li');
            for (let item of items) {
                item.classList.remove('active-reading');
            }
        }

        // Looping untuk membuat 10 kartu
        for (let i = 1; i <= 10; i++) {
            const cardDiv = document.createElement("div");
            cardDiv.className = "card";

            const header = document.createElement("div");
            header.className = "card-header";
            header.style.backgroundColor = colors[i - 1];

            const title = document.createElement("span");
            title.textContent = "Perkalian " + i;
            
            const btn = document.createElement("button");
            btn.className = "play-btn";
            btn.innerHTML = "🔊";
            btn.setAttribute("aria-label", "Putar suara perkalian " + i);
            
            // Kita perlu mempass elemen <ul> ke fungsi agar kita bisa memanipulasi isinya (highlight)
            // Karena <ul> dibuat setelah header, kita buat variabel referensi dulu
            let listRef = null;

            btn.onclick = function() {
                playGroup(i, btn, listRef);
            };

            header.appendChild(title);
            header.appendChild(btn);
            cardDiv.appendChild(header);

            const list = document.createElement("ul");
            listRef = list; // Simpan referensi <ul> ke variabel

            for (let j = 1; j <= 10; j++) {
                const listItem = document.createElement("li");
                listItem.innerHTML = `
                    <span>${i} × ${j} = </span>
                    <span class="result">${i * j}</span>
                `;
                list.appendChild(listItem);
            }

            cardDiv.appendChild(list);
            container.appendChild(cardDiv);
        }
    </script>

</body>
</html>
